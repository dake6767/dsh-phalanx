<!doctype html><html><head><meta charset="utf-8"><title>Interactive fixture</title><style>body{font:18px sans-serif;padding:24px}button,input{font:inherit;margin:8px}</style></head><body><h1>交互预览</h1><button id="increment">Count: 0</button><form id="form"><label>Name <input id="name"></label><button>Submit</button></form><p id="result">Waiting</p><p id="security"></p><script>
let count=0;document.querySelector('#increment').onclick=event=>{event.target.textContent='Count: '+(++count)};
document.querySelector('#form').onsubmit=event=>{event.preventDefault();document.querySelector('#result').textContent='Hello '+document.querySelector('#name').value};
const checks={};for(const [name,read] of Object.entries({parent:()=>parent.document.body.innerHTML,cookie:()=>document.cookie,storage:()=>localStorage.length})){try{read();checks[name]='allowed'}catch{checks[name]='blocked'}}
fetch('/account/identity',{credentials:'include'}).then(()=>{checks.fetch='allowed'}).catch(()=>{checks.fetch='blocked'}).finally(()=>{document.querySelector('#security').textContent=JSON.stringify(checks)});
</script></body></html>

# The member's native profile owns models, settings, account login and plugins.
# Only keep first-use workspace selection inside this private home.
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_PHALANX_WORKSPACE_DOCUMENTS_DIR

# Browser directory selection uses the official DSH remote-host picker.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

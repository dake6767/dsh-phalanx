# The member's native profile owns models, settings, account login and plugins.
# Only keep first-use workspace selection inside this private home.
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_PHALANX_WORKSPACE_DOCUMENTS_DIR

# The official converter discovers the image's pinned redistributable fonts.
# Keep kit fallback groups: an explicit fontFallbacks value would replace them.
- id: office-to-pdf
  config:
    fontDirectories: !!js "process.platform === 'linux' ? ['/usr/share/fonts', '/usr/local/share/fonts', process.env.HOME + '/.local/share/fonts', process.env.HOME + '/.fonts'] : undefined"

# Browser directory selection uses the official DSH remote-host picker.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# The DeepSeek Search and Fetch API providers stay unmounted until platform
# credential injection ships in the Search/Fetch ticket. Without this provider
# the Web search page still edits Messages search, but its new Search/Fetch
# switch and base URL are not served, so no member can select or reach the new
# APIs. That ticket removes this disable and configures the member gateway credential.
- id: web-deepseek-api
  disabled: true

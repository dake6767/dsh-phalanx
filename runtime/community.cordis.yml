# The member's native profile owns models, settings, account login and plugins.
# Only keep first-use workspace selection inside this private home.
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_PHALANX_WORKSPACE_DOCUMENTS_DIR

# The official converter discovers the image's pinned redistributable fonts.
# Keep kit fallback groups: an explicit fontFallbacks value would replace them.
- id: office-kit
  config:
    outputDirectory: !!js dshHomePath('office-kit', 'outputs')
    fontDirectories: !!js "process.platform === 'linux' ? ['/usr/share/fonts', '/usr/local/share/fonts', process.env.HOME + '/.local/share/fonts', process.env.HOME + '/.fonts'] : undefined"

# Browser directory selection uses the official DSH remote-host picker.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# Keep account notifications inside the member runtime.
- id: deepseek-account
  config:
    desktopPlatform: null
    allowLoopbackHttp: true
    harnessOrigin: http://127.0.0.1:1

# Search can only use the platform gateway. Fetch and the legacy direct
# search provider have no credentials or reachable destination.
- id: web-deepseek-api
  config:
    searchBaseURL: !!js new URL('/_dsh-phalanx/web/v1/tools', process.env.DSH_PHALANX_MODEL_GATEWAY_URL || 'http://127.0.0.1:1').href
    searchApiKeyEnv: DSH_PHALANX_WEB_TOOLS_ACCESS_TOKEN
    searchBilling: api-key
    sendOriginalQuestion: false
    fetchBaseURL: http://127.0.0.1:1
    fetchApiKeyEnv: DSH_PHALANX_DISABLED_SEARCH_KEY
- id: web-search-deepseek
  config:
    baseURL: http://127.0.0.1:1
    apiKeyEnv: DSH_PHALANX_DISABLED_SEARCH_KEY

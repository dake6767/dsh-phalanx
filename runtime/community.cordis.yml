# The member's native profile owns models, settings, account login and plugins.
# Only keep first-use workspace selection inside this private home.
- id: workspace-controller
  config:
    documentsDirectory: !!js process.env.DSH_PHALANX_WORKSPACE_DOCUMENTS_DIR

# The official converter discovers the image's pinned redistributable fonts.
# Keep kit fallback groups: an explicit fontFallbacks value would replace them.
- id: office-to-pdf
  config:
    fontDirectories: !!js "process.platform === 'linux' ? ['/usr/share/fonts', '/usr/local/share/fonts', process.env.HOME + '/.local/share/fonts', process.env.HOME + '/.fonts'] : undefined"

# Browser directory selection uses the official DSH remote-host picker.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# DeepSeek Search and Fetch go through the member gateway with the shared model
# credential; only the member-scoped access token reaches this process. The web
# service keeps the upstream default selection (Messages search and local HTTP
# fetch), so the member opts in from the Web search page (Q36: default off).
- id: web-deepseek-api
  config:
    baseURL: !!js new URL('/_dsh-phalanx/web/v1/tools', process.env.DSH_PHALANX_MODEL_GATEWAY_URL).href
    apiKeyEnv: DSH_PHALANX_MODEL_GATEWAY_ACCESS_TOKEN

name: Candidate cleanup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Completed formal version or explicitly marked reuse rehearsals
        required: true
        type: choice
        options: [formal, rehearsal]
      version:
        description: Formal target version; leave empty for rehearsals
        type: string
      rehearsal_runs:
        description: Comma-separated exact rehearsal run IDs; leave empty for formal cleanup
        type: string
permissions:
  contents: read
jobs:
  cleanup:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: candidate-image-publication
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Candidate repository token
        id: candidate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CANDIDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CANDIDATE_APP_PRIVATE_KEY }}
          owner: dake6767
          repositories: dsh-phalanx-candidates
          permission-contents: write
      - name: Inspect all references and remove only selected unreferenced images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CANDIDATE_GH_TOKEN: ${{ steps.candidate-token.outputs.token }}
          CLEANUP_MODE: ${{ inputs.mode }}
          FORMAL_VERSION: ${{ inputs.version }}
          REHEARSAL_RUNS: ${{ inputs.rehearsal_runs }}
        run: |
          if [ "$CLEANUP_MODE" = rehearsal ]; then
            test -z "$FORMAL_VERSION"
            options=(--rehearsal "$REHEARSAL_RUNS" --yes)
          else
            test -z "$REHEARSAL_RUNS"
            options=("$FORMAL_VERSION" --yes)
          fi
          node scripts/release/cleanup-candidates.mjs "${options[@]}" | tee cleanup.log
      - name: Preserve cleanup identity receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: cleanup.log
          if-no-files-found: ignore
          retention-days: 14

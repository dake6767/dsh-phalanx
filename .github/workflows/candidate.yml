name: Candidate
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full source commit reachable from this default-branch workflow revision
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.run_id }}
  cancel-in-progress: false
env:
  CANDIDATE_TAG: run-${{ github.run_id }}
  CANDIDATE_SHA: ${{ inputs.commit }}
jobs:
  trust:
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Trusted candidate identity
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/candidate.mjs verify
  checks:
    needs: trust
    uses: ./.github/workflows/ci.yml
    with:
      source_commit: ${{ needs.trust.outputs.commit }}
    permissions:
      contents: read
  t2:
    needs: [trust, checks]
    uses: ./.github/workflows/linux-t2.yml
    with:
      source_commit: ${{ needs.trust.outputs.commit }}
    permissions:
      contents: read
  build:
    needs: [trust, checks, t2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      artifact: ${{ steps.bundle.outputs.name }}
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: automation
          persist-credentials: false
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ needs.trust.outputs.commit }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: source/.node-version
      - name: Restore a completed immutable candidate on retry
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ../automation/scripts/release/candidate.mjs restore candidate
      - name: Build platform package on target Linux
        if: steps.restore.outputs.restored != 'true'
        run: |
          python3 scripts/download-sources.py --preset official --github-env >> "$GITHUB_ENV"
          corepack enable
          python3 scripts/download-sources.py --preset official -- corepack pnpm install --frozen-lockfile
          corepack pnpm build
          corepack pnpm build:admin-ui
          node scripts/release/package.mjs candidate
      - name: Installed platform archive browser smoke
        if: steps.restore.outputs.restored != 'true'
        env:
          DSH_PHALANX_CI_INSTALL_ROOT: ${{ github.workspace }}/source/candidate-smoke
        run: |
          mkdir candidate-smoke
          tar -xzf candidate/dsh-phalanx-linux-amd64.tar.gz -C candidate-smoke
          corepack pnpm install --frozen-lockfile --prod=false
          corepack pnpm exec playwright install --with-deps chromium
          corepack pnpm test:e2e tests/ci-product-smoke.e2e.ts tests/community-model-http.e2e.ts
          rm -rf candidate-smoke
      - name: Download the image that passed native T2
        if: steps.restore.outputs.restored != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.t2.outputs.image_artifact }}
          merge-multiple: true
          path: source/t2-image
      - name: Adopt tested image bytes and write candidate manifest
        if: steps.restore.outputs.restored != 'true'
        run: |
          node ../automation/scripts/release/t2-image.mjs t2-image candidate
          sudo apt-get update
          sudo apt-get install -y skopeo
          node ../automation/scripts/release/manifest.mjs candidate
      - name: Explicit project checksum verification
        run: node ../automation/scripts/release/verify.mjs candidate
      - name: Unique build artifact identity
        id: bundle
        run: echo "name=candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.bundle.outputs.name }}
          path: source/candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: candidate
      - name: Publish exact archive digest without changing an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          node scripts/release/publish-image.mjs candidate
  release:
    needs: [trust, build, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: candidate
      - name: Verify artifact identity before requesting publication credentials
        run: node scripts/release/verify.mjs candidate
      - name: Candidate repository token
        id: candidate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.CANDIDATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CANDIDATE_APP_PRIVATE_KEY }}
          owner: dake6767
          repositories: dsh-phalanx-candidates
          permission-contents: write
      - name: Resume draft uploads, verify every asset, then complete prerelease
        env:
          GH_TOKEN: ${{ steps.candidate-token.outputs.token }}
        run: node scripts/release/publish-release.mjs candidate

name: T2 real Linux
on:
  workflow_dispatch:
    inputs:
      test_files:
        description: Optional comma-separated regular T2 inventory subset (full acceptance leaves empty)
        type: string
        default: ""
      force_rebuild:
        type: boolean
        default: false
      reuse_rehearsal:
        type: boolean
        default: false
      reuse_baseline_run:
        type: string
        default: ""
  workflow_call:
    outputs:
      image_artifact:
        description: Exact amd64 image artifact from the successful T2 attempt
        value: ${{ jobs.amd64-verified.outputs.image_artifact }}
      development_image_artifact:
        description: Exact arm64 image artifact from the successful native smoke attempt
        value: ${{ jobs.native-arm64.outputs.development_image_artifact }}
    inputs:
      development_image_only:
        description: Run only native arm64 development smoke, not the full T2 inventory
        type: boolean
        default: false
      source_commit:
        description: Exact source selected by the trusted candidate caller
        type: string
        required: false
      force_rebuild:
        type: boolean
        default: false
      reuse_rehearsal:
        type: boolean
        default: false
      reuse_baseline_run:
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: linux-t2-${{ github.event_name }}-${{ github.ref }}-${{ inputs.source_commit }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.source_commit }}
env:
  SOURCE_SHA: ${{ inputs.source_commit || github.sha }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      upgrade: ${{ steps.scope.outputs.upgrade }}
      previous: ${{ steps.scope.outputs.previous }}
      mode: ${{ steps.t2-plan.outputs.mode }}
      matrix: ${{ steps.t2-plan.outputs.matrix }}
      plan: ${{ steps.t2-plan.outputs.plan }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - id: scope
        run: node scripts/validation/formal-baseline.mjs --github-output "$GITHUB_OUTPUT"
      - name: Select full inventory or changed installed cases
        id: t2-plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TEST_FILES: ${{ inputs.test_files }}
        run: |-
          options=()
          if [ "$EVENT" = pull_request ]; then options=(--pr "$BASE" "$HEAD");
          elif [ -n "$TEST_FILES" ]; then options=(--files "$TEST_FILES"); fi
          node scripts/validation/t2-plan.mjs "${options[@]}" --github-output "$GITHUB_OUTPUT"
  formal-upgrade:
    needs: scope
    if: needs.scope.outputs.upgrade == 'true' && !inputs.development_image_only && !inputs.reuse_rehearsal
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PREVIOUS: ${{ needs.scope.outputs.previous }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Install the formal previous release with its own installer
        run: |
          set -o pipefail
          # The hosted image exports the runner's XDG_CONFIG_HOME through pam_env, so every
          # `sudo -u dsh-phalanx` would read /home/runner/.config. Validation hosts have no such entry.
          sudo sed -i '/^XDG_CONFIG_HOME=/d' /etc/environment
          sudo -u nobody env | { ! grep -q '^XDG_CONFIG_HOME='; }
          python3 -c 'import shutil; assert shutil.disk_usage("/var/tmp").free >= 32 * 1024**3, "The formal upgrade job needs at least 32 GiB free."'
          mkdir -p -m 0777 /var/tmp/dsh-phalanx-upgrade-results
          git fetch --no-tags --depth=1 origin "refs/tags/v$PREVIOUS:refs/tags/v$PREVIOUS"
          # The tagged installer must belong to the accepted formal commit.
          test "$(git rev-parse "v$PREVIOUS^{commit}")" = "$(jq -r .commit "releases/acceptance/$PREVIOUS.json")"
          git show "v$PREVIOUS:install.sh" > /var/tmp/dsh-phalanx-formal-install.sh
          sudo install -m 0600 /dev/null /var/tmp/dsh-phalanx-formal-operator.json
          sudo bash /var/tmp/dsh-phalanx-formal-install.sh --version "v$PREVIOUS" --host-public-addresses '' --listen-address 127.0.0.1 --port 18080 --public-origin http://127.0.0.1:18080 --verbose --output json | sudo tee /var/tmp/dsh-phalanx-formal-operator.json >/dev/null
          sudo jq -e --arg version "v$PREVIOUS" '.version == $version' /etc/dsh-phalanx/install-state.json
      - name: Build this source as a verified local bundle
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y skopeo
          python3 scripts/download-sources.py --preset official --github-env >> "$GITHUB_ENV"
          corepack enable
          python3 scripts/download-sources.py --preset official -- corepack pnpm install --frozen-lockfile
          corepack pnpm build
          corepack pnpm build:admin-ui
      - name: Select this source's image
        id: image-selection
        run: |
          bundle=/var/tmp/dsh-phalanx-upgrade-bundle
          mkdir -p "$bundle"
          options=()
          if [ '${{ inputs.force_rebuild }}' = true ]; then options+=(--force-rebuild); fi
          node scripts/release/select-image.mjs "$bundle/image-selection.json" --platform linux/amd64 "${options[@]}"
          echo "IMAGE_INPUT_HASH=$(node -p "require('$bundle/image-selection.json').inputHash")" >> "$GITHUB_ENV"
          echo "IMAGE_REFERENCE=ghcr.io/$GITHUB_REPOSITORY:run-$GITHUB_RUN_ID" >> "$GITHUB_ENV"
      - if: steps.image-selection.outputs.mode == 'build'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - if: steps.image-selection.outputs.mode == 'build'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: containers/dsh
          file: containers/dsh/Containerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REFERENCE }}
          labels: |
            dsh.input.sha256=${{ env.IMAGE_INPUT_HASH }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NPM_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
            NODE_IMAGE=${{ env.DSH_PHALANX_BUILD_NODE_IMAGE }}
          outputs: type=oci,dest=/var/tmp/dsh-phalanx-upgrade-bundle/dsh-phalanx-dsh-linux-amd64.oci.tar
          cache-from: type=gha,scope=dsh-amd64
      - if: steps.image-selection.outputs.mode == 'reuse'
        env:
          REUSED_IMAGE: ${{ steps.image-selection.outputs.reference }}
        run: skopeo copy --preserve-digests "docker://$REUSED_IMAGE" "oci-archive:/var/tmp/dsh-phalanx-upgrade-bundle/dsh-phalanx-dsh-linux-amd64.oci.tar:$IMAGE_REFERENCE"
      - name: Package the platform and write the run-ID manifest
        run: |
          bundle=/var/tmp/dsh-phalanx-upgrade-bundle
          node scripts/release/package.mjs "$bundle" > /var/tmp/dsh-phalanx-upgrade-results/package.log 2>&1
          CANDIDATE_TAG="run-$GITHUB_RUN_ID" node scripts/release/manifest.mjs "$bundle" --image-selection "$bundle/image-selection.json"
          node scripts/release/verify.mjs "$bundle"
          cp "$bundle/manifest.json" "$bundle/SHA256SUMS" /var/tmp/dsh-phalanx-upgrade-results/
      - name: Upgrade the formal installation to this build
        run: |
          # Packaging deploys production dependencies only; the test runner needs the development set.
          corepack pnpm install --frozen-lockfile --prod=false > /var/tmp/dsh-phalanx-upgrade-results/dependencies.log 2>&1
          browsers=/var/cache/dsh-phalanx-upgrade-browsers
          sudo install -d -m 0755 "$browsers"
          # Call the installed CLI directly: pnpm as root would rebuild the runner-owned modules directory.
          sudo env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$browsers" node node_modules/playwright/cli.js install --with-deps chromium
          sudo env PATH="$PATH" PLAYWRIGHT_BROWSERS_PATH="$browsers" \
            DSH_PHALANX_FORMAL_UPGRADE_BUNDLE=/var/tmp/dsh-phalanx-upgrade-bundle DSH_PHALANX_FORMAL_UPGRADE_INSTALLER="$GITHUB_WORKSPACE/install.sh" \
            DSH_PHALANX_CANDIDATE_SHA="$SOURCE_SHA" DSH_PHALANX_CANDIDATE_TAG="run-$GITHUB_RUN_ID" DSH_PHALANX_E2E_EVIDENCE_DIR=/var/tmp/dsh-phalanx-upgrade-results \
            node node_modules/vitest/vitest.mjs run --config vitest.e2e.config.ts tests/installed-formal-upgrade.e2e.ts \
            --reporter=default --reporter=json --outputFile=/var/tmp/dsh-phalanx-upgrade-results/formal-upgrade.json
      - name: Make upgrade diagnostics readable by the artifact uploader
        id: diagnostics
        if: always()
        run: |
          results=/var/tmp/dsh-phalanx-upgrade-results
          test ! -L "$results"
          if [ ! -e "$results" ]; then exit 0; fi
          test -d "$results"
          test -z "$(sudo find "$results" -type l -print -quit)"
          sudo chown --recursive --no-dereference "$(id -u):$(id -g)" "$results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.diagnostics.outcome == 'success'
        with:
          name: t2-formal-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/tmp/dsh-phalanx-upgrade-results/
          retention-days: 7
  amd64-bundle:
    outputs:
      image_artifact: ${{ steps.image-artifact.outputs.artifact-id }}
      identity: ${{ steps.identity.outputs.value }}
      selection_mode: ${{ steps.image-selection.outputs.mode }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .node-version
      - name: Record native runner and prepare rootless service identity
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage("/var/tmp").free >= 32 * 1024**3, "T2 needs at least 32 GiB free before building; use a larger runner or remove disposable caches."'
          mkdir -p -m 0777 /var/tmp/dsh-phalanx-spike-results
          uname -a > /var/tmp/dsh-phalanx-spike-results/host.txt
          free -b >> /var/tmp/dsh-phalanx-spike-results/host.txt
          df -B1 / >> /var/tmp/dsh-phalanx-spike-results/host.txt
          /usr/bin/time -v sudo python3 - <<'PY' 2> /var/tmp/dsh-phalanx-spike-results/prerequisites-time.txt
          import sys
          sys.path.insert(0, 'scripts/install')
          import installer
          host = installer.Host()
          installer.dependencies(host)
          uid, gid = installer.identity(host)
          print('rootless service uid:', uid)
          PY
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv skopeo libnss3-tools
          python3 scripts/download-sources.py --preset official --github-env >> "$GITHUB_ENV"
          corepack enable
          python3 scripts/download-sources.py --preset official -- corepack pnpm install --frozen-lockfile
          corepack pnpm build
          corepack pnpm build:admin-ui
          sudo cp -a "$GITHUB_WORKSPACE" /var/tmp/dsh-phalanx-spike-source
          sudo chown -R dsh-phalanx:dsh-phalanx /var/tmp/dsh-phalanx-spike-source
      - name: Select the native image archive
        id: image-selection
        env:
          EXPECTED_ARCH: amd64
        run: |
          actual=$(uname -m)
          if [ "$EXPECTED_ARCH" = arm64 ]; then test "$actual" = aarch64; else test "$actual" = x86_64; fi
          version=$(node -p 'require("./package.json").version')
          echo "IMAGE_REFERENCE=ghcr.io/$GITHUB_REPOSITORY:$version-rc.$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          mkdir -p /var/tmp/dsh-phalanx-spike-bundle
          selection=/var/tmp/dsh-phalanx-spike-bundle/image-selection.json
          options=()
          if [ '${{ inputs.force_rebuild }}' = true ]; then options+=(--force-rebuild); fi
          if [ '${{ inputs.reuse_rehearsal }}' = true ]; then options+=(--reuse-rehearsal); fi
          node scripts/release/select-image.mjs "$selection" --platform "linux/$EXPECTED_ARCH" "${options[@]}"
          echo "IMAGE_INPUT_HASH=$(node -p 'require("/var/tmp/dsh-phalanx-spike-bundle/image-selection.json").inputHash')" >> "$GITHUB_ENV"
      - if: steps.image-selection.outputs.mode == 'build'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build the native image once with shared layer cache
        if: steps.image-selection.outputs.mode == 'build'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: containers/dsh
          file: containers/dsh/Containerfile
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE_REFERENCE }}
          labels: |
            dsh.input.sha256=${{ env.IMAGE_INPUT_HASH }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          build-args: |
            NPM_REGISTRY=${{ env.NPM_CONFIG_REGISTRY }}
            NODE_IMAGE=${{ env.DSH_PHALANX_BUILD_NODE_IMAGE }}
          outputs: type=oci,dest=/var/tmp/dsh-phalanx-spike-bundle/dsh-phalanx-dsh-linux-amd64.oci.tar
          cache-from: type=gha,scope=dsh-amd64
          cache-to: type=gha,scope=dsh-amd64,mode=max
      - name: Export the existing registry image by immutable digest
        if: steps.image-selection.outputs.mode == 'reuse'
        env:
          REUSED_IMAGE: ${{ steps.image-selection.outputs.reference }}
          EXPECTED_ARCH: amd64
        run: |
          skopeo copy --preserve-digests "docker://$REUSED_IMAGE" "oci-archive:/var/tmp/dsh-phalanx-spike-bundle/dsh-phalanx-dsh-linux-$EXPECTED_ARCH.oci.tar:$IMAGE_REFERENCE"
      - name: Import the exact OCI archive into rootless storage
        env:
          EXPECTED_ARCH: amd64
        run: |
          cd /var/tmp
          uid=$(id -u dsh-phalanx)
          sudo chown -R dsh-phalanx:dsh-phalanx /var/tmp/dsh-phalanx-spike-bundle
          sudo runuser -u dsh-phalanx -- env -i HOME=/var/lib/dsh-phalanx USER=dsh-phalanx LOGNAME=dsh-phalanx PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$uid" \
            podman load -i "/var/tmp/dsh-phalanx-spike-bundle/dsh-phalanx-dsh-linux-$EXPECTED_ARCH.oci.tar"
          sudo runuser -u dsh-phalanx -- env -i HOME=/var/lib/dsh-phalanx PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$uid" \
            podman image inspect "$IMAGE_REFERENCE" > /var/tmp/dsh-phalanx-spike-results/image.json
      - name: Measure cold and warm UID mapping
        working-directory: /var/tmp/dsh-phalanx-spike-source
        run: |
          uid=$(id -u dsh-phalanx)
          gid=$(id -g dsh-phalanx)
          id dsh-phalanx > /var/tmp/dsh-phalanx-spike-results/uid-mapping.txt
          cat /etc/subuid /etc/subgid >> /var/tmp/dsh-phalanx-spike-results/uid-mapping.txt
          for phase in cold warm; do
            /usr/bin/time -v -o "/var/tmp/dsh-phalanx-spike-results/uid-$phase-time.txt" \
              sudo runuser -u dsh-phalanx -- env -i HOME=/var/lib/dsh-phalanx USER=dsh-phalanx LOGNAME=dsh-phalanx PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$uid" \
              podman run --rm --network=none --userns=keep-id --user "$uid:$gid" \
              "$IMAGE_REFERENCE" sh -c 'id -u; id -g' > "/var/tmp/dsh-phalanx-spike-results/uid-$phase.txt"
            test "$(sed -n '1p' "/var/tmp/dsh-phalanx-spike-results/uid-$phase.txt")" = "$uid"
            test "$(sed -n '2p' "/var/tmp/dsh-phalanx-spike-results/uid-$phase.txt")" = "$gid"
          done
          df -B1 / >> /var/tmp/dsh-phalanx-spike-results/host.txt
      - name: Package and install the exact native artifact
        id: install
        working-directory: /var/tmp/dsh-phalanx-spike-source
        env:
          EXPECTED_ARCH: amd64
        run: |
          uid=$(id -u dsh-phalanx)
          set -o pipefail
          dev=()
          if [ "$EXPECTED_ARCH" = arm64 ]; then dev=(--dev-arm64); fi
          version=$(node -p 'require("./package.json").version')
          tag="v$version-rc.$GITHUB_RUN_ID"
          if [ '${{ inputs.reuse_rehearsal }}' = true ]; then tag="run-$GITHUB_RUN_ID"; fi
          image="ghcr.io/dake6767/dsh-phalanx:$version-rc.$GITHUB_RUN_ID"
          bundle=/var/tmp/dsh-phalanx-spike-bundle
          sudo install -d -o dsh-phalanx -g dsh-phalanx "$bundle"
          service=(sudo runuser -u dsh-phalanx -- env -i HOME=/var/lib/dsh-phalanx USER=dsh-phalanx LOGNAME=dsh-phalanx PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$uid")
          /usr/bin/time -v "${service[@]}" node scripts/release/package.mjs "$bundle" "${dev[@]}" > /var/tmp/dsh-phalanx-spike-results/package.log 2>&1
          # This archive was imported and exercised above; never re-export it,
          # since compression would change the manifest digest tested by T2.
          "${service[@]}" env CANDIDATE_TAG="$tag" GITHUB_RUN_ID="$GITHUB_RUN_ID" node scripts/release/manifest.mjs "$bundle" "${dev[@]}" --image-selection "$bundle/image-selection.json"
          cp "$bundle/manifest.json" "$bundle/SHA256SUMS" /var/tmp/dsh-phalanx-spike-results/
          # Operator JSON contains a bootstrap URL: keep it outside uploaded results.
          sudo install -m 0600 /dev/null /var/tmp/dsh-phalanx-spike-operator.json
          sudo bash install.sh "${dev[@]}" --version "$tag" --bundle-dir "$bundle" --host-public-addresses '' --listen-address 127.0.0.1 --port 18080 --public-origin http://127.0.0.1:18080 --verbose --output json | sudo tee /var/tmp/dsh-phalanx-spike-operator.json >/dev/null
          CI=true "${service[@]}" env CI=true corepack pnpm install --frozen-lockfile --prod=false > /var/tmp/dsh-phalanx-spike-results/dependencies.log 2>&1
          printf '%s\n' "$image" > /var/tmp/dsh-phalanx-spike-results/image-reference.txt
          df -B1 / >> /var/tmp/dsh-phalanx-spike-results/host.txt
      - name: Bind bundle bytes to this attempt
        id: identity
        run: |-
          identity=$(node scripts/validation/t2-shards.mjs identity /var/tmp/dsh-phalanx-spike-bundle "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")
          printf 'value=%s\n' "$identity" >> "$GITHUB_OUTPUT"
      - name: Prepare the immutable amd64 test bundle
        id: image-artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: t2-image-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            /var/tmp/dsh-phalanx-spike-bundle/dsh-phalanx-dsh-linux-amd64.oci.tar
            /var/tmp/dsh-phalanx-spike-bundle/manifest.json
            /var/tmp/dsh-phalanx-spike-bundle/image-selection.json
            /var/tmp/dsh-phalanx-spike-bundle/dsh-phalanx-linux-amd64.tar.gz
            /var/tmp/dsh-phalanx-spike-bundle/updater.json

            /var/tmp/dsh-phalanx-spike-bundle/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Record failed installation service diagnostics
        if: failure() && steps.install.outcome == 'failure'
        run: |
          # Raw output stays outside uploaded results; only redacted copies are uploaded.
          raw=$(sudo mktemp -d /var/tmp/dsh-phalanx-install-raw.XXXXXX)
          results=/var/tmp/dsh-phalanx-spike-results
          sudo sh -c "tail -n 400 /var/log/dsh-phalanx/*.jsonl > '$raw/installer-log-tail.jsonl' 2>&1" || true
          uid=$(id -u dsh-phalanx || true)
          service=(sudo runuser -u dsh-phalanx -- env -i HOME=/var/lib/dsh-phalanx USER=dsh-phalanx LOGNAME=dsh-phalanx PATH="$PATH" XDG_RUNTIME_DIR="/run/user/$uid")
          {
            for unit in dsh-phalanx-postgres.service dsh-phalanx.service; do
              echo "== $unit"
              "${service[@]}" systemctl --user status --no-pager --full "$unit" || true
              sudo journalctl _SYSTEMD_USER_UNIT="$unit" _UID="$uid" -n 80 --no-pager || true
            done
            echo "== user manager"
            sudo journalctl _UID="$uid" -n 120 --no-pager || true
            echo "== kernel"
            sudo journalctl -k -n 200 --no-pager | grep -i -E 'apparmor|denied|audit' || true
            echo "== versions"
            podman --version || true
            dpkg -l podman passt conmon crun uidmap 2>/dev/null | grep '^ii' || true
            sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>/dev/null || true
          } 2>&1 | sudo tee "$raw/install-failure.txt" > /dev/null
          for name in install-failure.txt installer-log-tail.jsonl; do
            sudo python3 scripts/validation/redact-diagnostics.py "$raw/$name" "$results/$name" || sudo rm -f "$results/$name"
          done
          sudo rm -rf "$raw"
      - name: Make private test diagnostics readable by the artifact uploader
        id: diagnostics
        if: always()
        run: |
          results=/var/tmp/dsh-phalanx-spike-results
          # Tests can write /var/tmp; refuse a pre-existing receipt path instead of uploading it.
          receipt=/var/tmp/dsh-phalanx-results-check
          if ! mkdir -m 0755 "$receipt"; then echo "::error::Receipt path already exists; nothing from it is uploaded"; exit 1; fi
          echo "receipt=ready" >> "$GITHUB_OUTPUT"
          if [ -L "$results" ]; then echo "::error::Results root is a symbolic link"; exit 1; fi
          if [ ! -e "$results" ]; then exit 0; fi
          if [ ! -d "$results" ]; then echo "::error::Results root is not a directory"; exit 1; fi
          if sudo test -f "$results/cleanup.json" && ! sudo test -L "$results/cleanup.json"; then sudo cat "$results/cleanup.json" > "$receipt/cleanup.json" || true; fi
          # Links never enter uploaded results; name each one (escaped, redacted) so the owning case can be fixed.
          raw=$(mktemp)
          sudo find "$results" -type l -exec ls -ldb {} + > "$raw"
          if [ -s "$raw" ]; then
            if ! python3 scripts/validation/redact-diagnostics.py "$raw" "$receipt/links.txt"; then
              : > "$receipt/links.txt"
              echo "::error::Link list could not be redacted; it is withheld"
            fi
            rm -f "$raw"
            echo "::error::Results contain symbolic links:"
            token=$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')
            echo "::stop-commands::$token"
            cat "$receipt/links.txt"
            echo "::$token::"
            exit 1
          fi
          rm -f "$raw"
          sudo chown --recursive --no-dereference "$(id -u):$(id -g)" "$results"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.diagnostics.outcome == 'success'
        with:
          name: t2-amd64-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: /var/tmp/dsh-phalanx-spike-results/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02

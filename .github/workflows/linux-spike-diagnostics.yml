name: Linux service environment diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/0.1.16-spike]
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Prepare the actual installer service identity
        run: |
          sudo python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/install')
          import installer
          host = installer.Host()
          installer.dependencies(host)
          installer.identity(host)
          PY
      - name: Compare direct and systemd rootless storage access
        working-directory: /var/tmp
        run: |
          uid=$(id -u dsh-phalanx)
          service=(sudo runuser -u dsh-phalanx -- env -i HOME=/var/lib/dsh-phalanx USER=dsh-phalanx LOGNAME=dsh-phalanx PATH=/usr/bin:/bin XDG_RUNTIME_DIR="/run/user/$uid")
          id dsh-phalanx
          stat -c '[DEBUG-runtime] directory uid=%u path=%n' "/run/user/$uid"
          "${service[@]}" systemctl --user show-environment | sed -n '/^\(XDG_RUNTIME_DIR\|XDG_CONFIG_HOME\|XDG_DATA_HOME\|HOME\|CONTAINERS_CONF\|CONTAINERS_CONF_OVERRIDE\|CONTAINERS_STORAGE_CONF\)=/p'
          "${service[@]}" podman ps -a --format '{{.ID}}'
          original=0
          "${service[@]}" systemd-run --user --wait --pipe --collect \
            --property="Environment=XDG_RUNTIME_DIR=/run/user/$uid" \
            /usr/bin/podman ps -a --format '{{.ID}}' || original=$?
          printf '[DEBUG-storage] inherited exit=%s\n' "$original"
          "${service[@]}" systemd-run --user --wait --pipe --collect \
            --property="Environment=XDG_RUNTIME_DIR=/run/user/$uid" \
            --property=Environment=CONTAINERS_STORAGE_CONF=/var/lib/dsh-phalanx/.config/containers/storage.conf \
            /usr/bin/podman ps -a --format '{{.ID}}' || storage=$?
          printf '[DEBUG-storage] storage-only exit=%s\n' "${storage:-0}"
          "${service[@]}" systemd-run --user --wait --pipe --collect \
            --property="Environment=XDG_RUNTIME_DIR=/run/user/$uid" \
            --property=Environment=CONTAINERS_STORAGE_CONF=/var/lib/dsh-phalanx/.config/containers/storage.conf \
            --property=Environment=XDG_CONFIG_HOME=/var/lib/dsh-phalanx/.config \
            /usr/bin/podman ps -a --format '{{.ID}}'
          "${service[@]}" systemd-run --user --wait --pipe --collect \
            --property="Environment=XDG_RUNTIME_DIR=/run/user/$uid" \
            --property=Environment=XDG_CONFIG_HOME=/var/lib/dsh-phalanx/.config \
            /usr/bin/podman ps -a --format '{{.ID}}'
